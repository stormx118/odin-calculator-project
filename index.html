<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="main-container">
        <h1>Mathematical Calculator</h1>
        <div class="result-display">
            <div class="expression"><span class="first-value"></span><span class="operator-sign"></span><span  class="second-value"></span></div>  
            <div class="calculations"></div>
        </div>
    <div class="buttons">
        <div class="first-part-buttons" >
            <button class="clearing-button">Clear</button>
            <button class="digits">1</button>
            <button class="digits">2</button>
            <button class="digits">3</button>
            <button class="digits">4</button>
            <button class="digits">5</button>
            <button class="digits">6</button>
            <button class="digits">7</button>
            <button class="digits">8</button>
            <button class="digits">9</button>
            <button class="digits">0</button>
            <button class="evaluator">=</button>
            <button class="backspace"><img src="./images/backspace-icon.png" alt="a backspace icon"></button>
        </div>
        <div class="second-part-buttons">
            <button class="operators">/</button>
            <button class="operators">*</button>
            <button class="operators">+</button>
            <button class="operators">-</button>
            <button class="decimal">.</button>
            
        </div>
        </div>
        
    </div>
</body>
</html>
